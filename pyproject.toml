[project]
name = "scout"
version = "0.1.0"
description = "Personal lead-gen / enrichment / outreach agent system"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright>=1.45",
    "mcp==1.28.1",  # pinned to match warden's known-working version -- mcp 2.0 moved FastMCP
    "python-dotenv>=1.0",
    "dnspython>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["scout*"]
